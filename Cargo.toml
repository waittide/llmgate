[package]
name = "octopus"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dashmap = "6.2.1"
eventsource-stream = "0.2.3"
futures = "0.3.34"
futures-util = "0.3.34"
hex = "0.4.3"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
mime_guess = "2.0.5"
parking_lot = "0.12.5"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "stream", "gzip"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid"] }
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace", "fs", "compression-full", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
