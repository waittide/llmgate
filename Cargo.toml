[package]
name = "llmgate"
version = "0.1.0"
edition = "2024"
authors = ["waittide <waittide@outlook.com>"]
description = "全能 AI 服务网关：多协议互转、多渠道聚合与用量统计的单二进制 LLM 网关"
license = "MIT"
repository = "https://github.com/waittide/llmgate"
keywords = ["llm", "gateway", "proxy", "openai", "anthropic"]
categories = ["web-programming::http-server"]

[[bin]]
name = "lg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
dashmap = "6.2.1"
futures = "0.3.34"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
nanoid = "0.5.0"
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", features = ["gzip", "json", "stream"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["chrono", "macros", "runtime-tokio", "sqlite", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["compression-full", "cors", "fs", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
