name: build

# 触发方式：
#   - push 到 main / 任意 PR：多平台构建并上传产物（可随时下载验证）
#   - push v* 标签：构建后发布 GitHub Release
#       · 日期标签 v2026.09.17（每日快照）发布为 pre-release
#       · 语义化标签 v0.2.0（人工维护的里程碑）发布为正式 Release，成为 Latest
#   - 每天 00:00（北京时间）：自动构建并发布当日快照，见下方 schedule
#   - 手动：Actions 页面点 “Run workflow”
#
# 每日快照与发布都在本工作流内完成，因此全程只需默认的 GITHUB_TOKEN：
# GitHub 为防止递归触发，GITHUB_TOKEN 产生的 push 事件不会启动新工作流，
# 但这里根本不依赖「用标签去触发另一个工作流」，所以不受该限制影响，无需 PAT。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # cron 用 UTC：16:00 UTC == 次日 00:00 (UTC+8)。
    # 该时刻处于下班时段，不产生落在 07:00-20:00 工作时间的发布记录。
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 与仓库 rust-toolchain.toml 保持一致：工程要求 nightly
  RUST_TOOLCHAIN: nightly

jobs:
  # 版本信息只在这里算一次，构建矩阵与发布 job 共用，避免各平台各算各的。
  meta:
    name: 计算版本信息
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.ver.outputs.skip }}
      release: ${{ steps.ver.outputs.release }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      artifact_version: ${{ steps.ver.outputs.artifact_version }}
      build_version: ${{ steps.ver.outputs.build_version }}
      image_changed: ${{ steps.ver.outputs.image_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要标签与历史：快照要找出上一个日期标签并比对其提交
          fetch-depth: 0

      - name: 计算版本号与发布信息
        id: ver
        shell: bash
        env:
          # 临时停用每日快照：仓库 Settings → Variables 加 NIGHTLY_ENABLED=false
          NIGHTLY_ENABLED: ${{ vars.NIGHTLY_ENABLED }}
        run: |
          set -euo pipefail

          sha=$(git rev-parse --short=7 HEAD)
          version=""
          release=false
          skip=false
          prerelease=false
          release_tag=""
          # 容器镜像是否需要重建。默认 true（分支/标签构建一律出镜像），
          # 只有每日快照会在「构建输入没变」时置为 false，见下面的 schedule 分支。
          image_changed=true

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            # ---- 每日快照 ----
            if [ "${NIGHTLY_ENABLED}" = "false" ]; then
              echo "每日快照已通过 NIGHTLY_ENABLED=false 停用"
              skip=true
            else
              # 按北京日期命名。cron 在 16:00 UTC 触发时北京已是次日。
              version=$(TZ=Asia/Shanghai date +%Y.%m.%d)
              release_tag="v${version}"
              prerelease=true

              # 只跟上一个日期快照比较，且按创建时间取最新。
              # 刻意不用“最新 v* 标签”：手工发的 v0.2.0 会按创建时间排在前面，
              # 而日期标签在版本序上又压过它（2026 > 0），两种取法都会取错基准。
              # 用 for-each-ref --count=1 而非 `git tag | head -1`：
              # 后者在标签累积很多时可能因 SIGPIPE 被 pipefail 判为失败。
              last=$(git for-each-ref --sort=-creatordate --count=1 --format='%(refname:short)' \
                'refs/tags/v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]')
              if [ -n "${last}" ] && [ "$(git rev-parse "${last}^{commit}")" = "$(git rev-parse HEAD)" ]; then
                echo "自 ${last} 以来无新提交，跳过本次快照"
                skip=true
              else
                echo "本次快照标签：${release_tag}（上一个：${last:-无}）"
                release=true
                # 每日快照的镜像只跟构建输入挂钩：只动文档/截图的提交不必重打镜像。
                # 与二进制快照不同，这里不看「有没有新提交」，只看构建输入变没变。
                if [ -n "${last}" ] \
                  && git diff --quiet "${last}" HEAD -- \
                       src web Cargo.toml Cargo.lock build.rs rust-toolchain.toml Dockerfile Dockerfile.ci .dockerignore; then
                  echo "构建输入自 ${last} 以来未变化，跳过镜像重建"
                  image_changed=false
                fi
              fi
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # ---- 标签构建：版本以标签为准 ----
            version="${GITHUB_REF_NAME#v}"
            release_tag="${GITHUB_REF_NAME}"
            release=true
            # 纯日期形式判定为快照，发布为 pre-release：
            # GitHub 的 Latest 只认最新的非预发布版本，故快照不会挤掉正式版。
            if [[ "${version}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
              prerelease=true
            fi
          else
            # ---- 分支 / PR 构建：只上传产物，不发布 ----
            version=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml | head -1)
          fi

          # 跳过时（如已停用）无需版本号，避免 set -u 下引用未绑定变量
          if [ "${skip}" != "true" ] && [ -z "${version}" ]; then
            echo "无法确定版本号" >&2
            exit 1
          fi

          {
            echo "skip=${skip}"
            echo "release=${release}"
            echo "release_tag=${release_tag}"
            echo "prerelease=${prerelease}"
            echo "artifact_version=${version}"
            # 注入给二进制的构建标识：版本号 + 提交短 hash
            echo "build_version=${version}+${sha}"
            echo "image_changed=${image_changed}"
          } >> "$GITHUB_OUTPUT"

          echo "版本=${version} 发布=${release} 快照=${prerelease} 跳过=${skip} 镜像=${image_changed} 注入=${version}+${sha}"

  build:
    name: ${{ matrix.name }}
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      # 前端资产在 cargo build 时经 rust-embed 内嵌进二进制，必须先构建前端
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 构建前端
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: 校验前端产物
        shell: bash
        run: test -f static/out/index.html

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建 llmgate
        env:
          # 由根目录 build.rs 透传给 rustc，成为二进制自报的版本号
          LLMGATE_BUILD_VERSION: ${{ needs.meta.outputs.build_version }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 打包
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.meta.outputs.artifact_version }}
        run: |
          set -euo pipefail
          pkg="llmgate-${VERSION}-${TARGET}"
          bin="target/${TARGET}/release/lg"
          [ "${RUNNER_OS}" = "Windows" ] && bin="${bin}.exe"

          mkdir -p "dist/${pkg}"
          cp "${bin}" README.md LICENSE "dist/${pkg}/"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            (cd dist && 7z a "${pkg}.zip" "${pkg}" >/dev/null)
          else
            (cd dist && tar czf "${pkg}.tar.gz" "${pkg}")
          fi
          rm -rf "dist/${pkg}"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: llmgate-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # 组装镜像：二进制由上面的 build job 在原生 runner 上按架构编好（含 linux/arm64），
  # 这里只把它们摊到 build/linux/<arch>/lg，再用 Dockerfile.ci 组装 —— 镜像里没有编译，
  # 所以 arm64 不必在 QEMU 里重跑一遍 Rust 编译。本地从源码构建仍走根目录的 Dockerfile。
  #   - push main / 手动触发 → dev（滚动预览版，另附 sha-* 标签）
  #   - 每日快照           → dev；构建输入自上一个快照以来没变则整个 job 跳过
  #   - push v*           → 对应版本号；语义化版本额外顶 latest
  #   - PR                → 只构建校验，不推送
  # 放在本工作流内而非独立工作流，是因为每日快照的标签由 GITHUB_TOKEN 创建，
  # 按注释所述不会触发新的 push 事件；同一次运行里构建才能覆盖快照。
  docker:
    name: 组装并推送 Docker 镜像
    needs: [meta, build]
    # 只有每日快照会在构建输入没变时把 image_changed 置 false（其余事件恒为 true）
    if: |
      needs.meta.outputs.skip != 'true'
      && needs.meta.outputs.image_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # 只取两个 linux 架构的产物，macOS / Windows 的与镜像无关
      - uses: actions/download-artifact@v8
        with:
          pattern: llmgate-*-unknown-linux-gnu
          path: dist
          merge-multiple: true

      - name: 按架构摊开二进制
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.artifact_version }}
        run: |
          set -euo pipefail
          for pair in x86_64:amd64 aarch64:arm64; do
            target="${pair%%:*}-unknown-linux-gnu"
            arch="${pair##*:}"
            mkdir -p "build/linux/${arch}"
            tar xzf "dist/llmgate-${VERSION}-${target}.tar.gz" -C /tmp --strip-components=1
            cp /tmp/lg "build/linux/${arch}/lg"
          done
          ls -lR build/linux

      # QEMU 现在只用来跑运行时镜像里那几条 apt / useradd 指令
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: 计算镜像标签
        id: img
        shell: bash
        run: |
          set -euo pipefail
          # GHCR 要求镜像名全小写
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=()

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # 仅校验构建，标签只用于本地标识，不会被推送
            tags+=("${image}:pr-${GITHUB_REF_NAME//\//-}")
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            # 每日快照固定 dev；构建输入没变时本 job 已被 meta.image_changed 拦下
            tags+=("${image}:dev")
          elif [ "${{ needs.meta.outputs.release }}" = "true" ]; then
            # 版本标签 + 纯版本号，如 v0.2.0 / 0.2.0
            tags+=("${image}:${{ needs.meta.outputs.release_tag }}")
            tags+=("${image}:${{ needs.meta.outputs.artifact_version }}")
            # 只有人工维护的语义化版本才顶 latest
            if [ "${{ needs.meta.outputs.prerelease }}" != "true" ]; then
              tags+=("${image}:latest")
            fi
          else
            # 分支推送与手动触发：滚动 dev
            tags+=("${image}:dev")
          fi

          # PR 不推送，其余场景都额外留一个可按提交定位的标签
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            tags+=("${image}:sha-${GITHUB_SHA::7}")
          fi

          joined=$(IFS=,; echo "${tags[*]}")
          echo "tags=${joined}" >> "$GITHUB_OUTPUT"
          echo "镜像标签: ${joined}"

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ci
          # PR 只验 amd64，合入后才出多架构镜像
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.img.outputs.tags }}
          # source 标签用于把 GHCR 上的包关联回本仓库
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.artifact_version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: 发布 Release
    needs: [meta, build]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # 各平台产物合并后统一出一份校验和（分散在各 artifact 里会重名冲突）
      - name: 生成校验和
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.release_tag }}
          # 仅当标签尚不存在时生效（快照场景由这里创建标签）；已存在的标签会被忽略
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          # 每日快照标为 pre-release，不抢占 Latest；人工语义化版本才是正式版
          prerelease: ${{ needs.meta.outputs.prerelease }}
